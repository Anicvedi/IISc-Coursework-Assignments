<svg style="background-color: white;" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:s="https://github.com/nturley/netlistsvg" width="96" height="96">
  <style>svg {
    stroke:#000;
    fill:none;
  }
  text {
    fill:#000;
    stroke:none;
    font-size:10px;
    font-weight: bold;
    font-family: "Courier New", monospace;
  }
  .nodelabel {
    text-anchor: middle;
  }
  .inputPortLabel {
    text-anchor: end;
  }
  .splitjoinBody {
    fill:#000;
  }</style>
  <rect width="100%" height="100%" fill="white" stroke="none"/>
  <g s:type="inputExt" transform="translate(12,22)" s:width="30" s:height="20" id="cell_clk">
    <text x="15" y="-4" class="nodelabel cell_clk" s:attribute="ref">clk</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_clk"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="inputExt" transform="translate(54,22)" s:width="30" s:height="20" id="cell_mode">
    <text x="15" y="-4" class="nodelabel cell_mode" s:attribute="ref">mode</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="cell_mode"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>
  <g s:type="outputExt" transform="translate(12,64)" s:width="30" s:height="20" id="cell_count">
    <text x="15" y="-4" class="nodelabel cell_count" s:attribute="ref">count</text>
    <s:alias val="$_outputExt_"/>
